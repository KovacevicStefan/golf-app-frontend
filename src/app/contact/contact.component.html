<div class="background">
  <div class="background-image"></div>
  <div class="container anim">
    <div class="left center">
      <div class="form-box">
        <form [formGroup]="contactForm" (ngSubmit)="sendMessage()">
          <div class="inputs">
            <div class="namelast">
              <input type="text" class="small-area" formControlName="name" required placeholder="Ime*">
              <input type="text" class="small-area" formControlName="lastName" required placeholder="Prezime*">
            </div>
            <input type="email" formControlName="email" required placeholder="Email*">
            <input type="text" formControlName="subject" placeholder="Naslov">
          </div>
          <div class="textarea center mb-4">
            <textarea formControlName="message" placeholder="Napišite nam kratku poruku"></textarea>
          </div>
          <div>
            <button type="submit" class="link active">Pošalji poruku</button>
          </div>
        </form>
      </div>
    </div>
    <div class="right">
      <div class="m-ver center-small" style="flex-direction: column;">
        <h1 class="m-ver" style="font-weight: 700;">Kontakt</h1>
        <p class="text">Želimo da čujemo Vaše mišljenje! Bilo da imate pitanje, sugestiju ili samo želite da nas pozdravite, napišite nam poruku putem forme.</p>
        <p class="text contact">{{email}} <br> Tel: 1-800-000-0000</p>
      </div>
    </div>
  </div>
</div>
