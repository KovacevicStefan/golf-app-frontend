<div class="under-header">
    <div class="container pb-5">
        <div class="pt-5 pb-4 heading">
            <div class="logo">
                <img class="image-tag" src="/images/logo.png" width="100px" alt="">
            </div>
            <div class="description">
                <h1 style="cursor: pointer;" [routerLink]="['/tournament', player?.tournamentId]" >{{player?.tournamentName}}</h1>
                <p class="pg">Rezultati za korisnika {{player?.playerUsername}}</p>
                <button *ngIf="isPlayerRegistered && player?.status" (click)="setEditable()" >{{buttonText}}</button> &nbsp;
                <button *ngIf="isEditable" (click)="saveHoles()" >Sacuvaj</button>
            </div>
        </div>
        <div class="bg-card">
            <h3 class="pb-3 sub-heading" >Rezultat po rundama</h3>
            <div *ngFor="let round of rounds" class="result">
                <div class="round">{{round?.indexNumber}}. runda</div>
                <div class="holes">
                    <div class="bottom">
                        <div class="profile" [routerLink]="['/profile', player?.playerUsername]">
                            <img src="{{player?.playerImage}}" width="50px" alt="">
                            <h5>{{player?.playerUsername}}</h5>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <td *ngFor="let hole of holes[round.id]" class="hole-number" style="font-size: small;"> {{hole.number}} </td>
                                </tr>
                                <tr>
                                    <th *ngFor="let hole of holes[round.id]"> {{hole.par}} </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <!-- <td *ngFor="let hole of holes[round.id]" class="single-result" id="{{hole.score}}"> </td> -->
                                    <td *ngFor="let hole of holes[round.id]" class="single-result" id="{{hole.score}}">
                                        <p *ngIf="!isEditable" style="margin: 0;">{{hole.strokes || 0}}</p>
                                        <input *ngIf="isEditable" class="edit" type="text" [(ngModel)]="hole.strokes" [name]="'hole-' + hole.id">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="legend">
                <div *ngFor="let score of scoreCategories">
                    <input id="{{score?.color}}" type="text" disabled>
                    <label>{{score?.name}}</label>
                </div>
            </div>
        </div>
    </div>
</div>
